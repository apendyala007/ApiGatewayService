spring:
  application:
    name: bharatbank-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:configserver:http://localhost:8888"

---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/customers/**,/api/kyc/**
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/accounts/**,/api/transactions/**

---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: https://user-service.bharatbank.com
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: customer-service
          uri: https://customer-service.bharatbank.com
          predicates:
            - Path=/api/customers/**,/api/kyc/**
        - id: account-service
          uri: https://account-service.bharatbank.com
          predicates:
            - Path=/api/accounts/**,/api/transactions/**

---
