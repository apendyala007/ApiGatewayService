server:
  port: 8080

spring:
  application:
    name: bharatbank-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
        # User Service Routes
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackuri: forward:/fallback/user-service
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
        
        # Customer Service Routes
            - id: customer-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/customers/**,/api/kyc/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customer-service
                    fallbackuri: forward:/fallback/customer-service
                - AuthenticationFilter
        
        # Account Service Routes
            - id: account-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/accounts/**,/api/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: account-service
                    fallbackuri: forward:/fallback/account-service
                - AuthenticationFilter
        # Notification Service Routes
            - id: notification-service
              uri: http://localhost:8085  # or appropriate port
              predicates:
                - Path=/api/notifications/**,/api/alerts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackuri: forward:/fallback/notification-service
                - AuthenticationFilter

        # Payment Service Routes
            - id: payment-service
              uri: http://localhost:8086  # or appropriate port
              predicates:
                - Path=/api/payments/**,/api/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: payment-service
                    fallbackuri: forward:/fallback/payment-service
                - AuthenticationFilter
        
        # Audit Service Routes
            - id: audit-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/audit/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: audit-service
                    fallbackuri: forward:/fallback/audit-service
                - AuthenticationFilter
        
        # Beneficiary Service Routes
            - id: beneficiary-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/beneficiaries/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: beneficiary-service
                    fallbackuri: forward:/fallback/beneficiary-service
                - AuthenticationFilter
        
        # Card Service Routes
            - id: card-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/cards/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: card-service
                    fallbackuri: forward:/fallback/card-service
                - AuthenticationFilter
      
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=X-Response-Default-Foo, Default-Bar
            - Retry=3

  # Redis for rate limiting
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Security
security:
  jwt:
    secret: ${JWT_SECRET:bharatbank-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
    expiration: 86400000

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      customer-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      notification-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      payment-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      audit-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      beneficiary-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      card-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50


# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.bharatbank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
