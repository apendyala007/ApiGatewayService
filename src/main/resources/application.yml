server:
  port: 8090

spring:
  application:
    name: BharatBankApiGateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: false
      server:
        webflux:
          routes:
            # User Service Routes
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - PrefixPath=/bharatbank-user-service
            
            # Customer Service Routes
            - id: customer-service
              uri: lb://bharatbank-customer-service
              predicates:
                - Path=/api/customers/**,/api/kyc/**
              filters:
                - PrefixPath=/bharatbank-customer-service
                - name: CircuitBreaker
                  args:
                    name: customer-service
                    fallbackuri: forward:/fallback/customer-service
                - AuthenticationFilter
        
            # Account Service Routes
            - id: account-service
              uri: lb://bharatbank-account-service
              predicates:
                - Path=/api/accounts/**,/api/transactions/**
              filters:
                - PrefixPath=/bharatbank-account-service
                - name: CircuitBreaker
                  args:
                    name: account-service
                    fallbackuri: forward:/fallback/account-service
                - AuthenticationFilter
        
            # Notification Service Routes
            - id: notification-service
              uri: lb://bharatbank-notification-service
              predicates:
                - Path=/api/notifications/**,/api/alerts/**
              filters:
                - PrefixPath=/bharatbank-notification-service
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackuri: forward:/fallback/notification-service
                - AuthenticationFilter

            # Payment Service Routes
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**,/api/transactions/**
              filters:
                - PrefixPath=/bharatbank-payment-service
                - name: CircuitBreaker
                  args:
                    name: payment-service
                    fallbackuri: forward:/fallback/payment-service
                - AuthenticationFilter
        
            # Audit Service Routes
            - id: audit-service
              uri: lb://bharatbank-audit-service
              predicates:
                - Path=/api/audit/**
              filters:
                - PrefixPath=/bharatbank-audit-service
                - name: CircuitBreaker
                  args:
                    name: audit-service
                    fallbackuri: forward:/fallback/audit-service
                - AuthenticationFilter
        
            # Beneficiary Service Routes
            - id: beneficiary-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/beneficiaries/**
              filters:
                - PrefixPath=/bharatbank-beneficiary-service
                - name: CircuitBreaker
                  args:
                    name: beneficiary-service
                    fallbackuri: forward:/fallback/beneficiary-service
                - AuthenticationFilter

            # Beneficiary Service Routes - Direct service name access (from frontend proxy)
            - id: beneficiary-service-direct
              uri: http://localhost:8086
              predicates:
                - Path=/bharatbank-beneficiary-service/api/beneficiaries/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: beneficiary-service
                    fallbackuri: forward:/fallback/beneficiary-service
                - AuthenticationFilter
        
            # Card Service Routes
            - id: card-service
              uri: lb://bharatbank-card-service
              predicates:
                - Path=/api/cards/**
              filters:
                - PrefixPath=/bharatbank-card-service
                - name: CircuitBreaker
                  args:
                    name: card-service
                    fallbackuri: forward:/fallback/card-service
                - AuthenticationFilter
        
            # Report Service Routes
            - id: report-service
              uri: lb://bharatbank-report-service
              predicates:
                - Path=/api/reports/**
              filters:
                - PrefixPath=/bharatbank-report-service
                - name: CircuitBreaker
                  args:
                    name: report-service
                    fallbackuri: forward:/fallback/report-service
                - AuthenticationFilter
      
      # default-filters:
      #       - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      #       - AddResponseHeader=X-Response-Default-Foo, Default-Bar
      #       - Retry=3

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Security - OAuth2 disabled (Keycloak not running), using custom JWT only
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/auth/realms/bharatbank}
#          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8081/auth/realms/bharatbank/protocol/openid-connect/certs}

security:
  jwt:
    secret: ${JWT_SECRET:bharatbank-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
    expiration: 86400000

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      customer-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      notification-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      payment-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      audit-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      beneficiary-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      card-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      report-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.bharatbank.gateway: DEBUG
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    reactor.netty: INFO
