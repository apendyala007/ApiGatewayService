server:
  port: 8080

spring:
  application:
    name: bharatbank-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
        # User Service Routes
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackuri: forward:/fallback/user-service
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"
        
        # Customer Service Routes
            - id: customer-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/customers/**,/api/kyc/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: customer-service
                    fallbackuri: forward:/fallback/customer-service
                - AuthenticationFilter
        
        # Account Service Routes
            - id: account-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/accounts/**,/api/transactions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: account-service
                    fallbackuri: forward:/fallback/account-service
                - AuthenticationFilter
      
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=X-Response-Default-Foo, Default-Bar
            - Retry=3

  # Redis for rate limiting
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Security
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-here}
    expiration: 86400000

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      customer-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.bharatbank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
