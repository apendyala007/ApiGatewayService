server:
  port: 8090

spring:
  application:
    name: BharatBankApiGateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: false
      # Routes are now defined in GatewayRouteConfig.java
      # default-filters:
      #       - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      #       - AddResponseHeader=X-Response-Default-Foo, Default-Bar
      #       - Retry=3

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Security - OAuth2 disabled (Keycloak not running), using custom JWT only
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/auth/realms/bharatbank}
#          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8081/auth/realms/bharatbank/protocol/openid-connect/certs}

security:
  jwt:
    secret: ${JWT_SECRET:bharatbank-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
    expiration: 86400000

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      customer-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
