server:
  port: 8080

spring:
  application:
    name: BharatBankApiGateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service Routes
        - id: user-service
          uri: lb://bharatbank-user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackuri: forward:/fallback/user-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"
        
        # Customer Service Routes
        - id: customer-service
          uri: lb://bharatbank-customer-service
          predicates:
            - Path=/api/customers/**,/api/kyc/**
          filters:
            - name: CircuitBreaker
              args:
                name: customer-service
                fallbackuri: forward:/fallback/customer-service
            - AuthenticationFilter
        
        # Account Service Routes
        - id: account-service
          uri: lb://bharatbank-account-service
          predicates:
            - Path=/api/accounts/**,/api/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: account-service
                fallbackuri: forward:/fallback/account-service
            - AuthenticationFilter
        
        # Notification Service Routes
        - id: notification-service
          uri: lb://bharatbank-notification-service
          predicates:
            - Path=/api/notifications/**,/api/alerts/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackuri: forward:/fallback/notification-service
            - AuthenticationFilter

        # Payment Service Routes
        - id: payment-service
          uri: lb://bharatbank-payment-service
          predicates:
            - Path=/api/payments/**,/api/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackuri: forward:/fallback/payment-service
            - AuthenticationFilter
        
        # Audit Service Routes
        - id: audit-service
          uri: lb://bharatbank-audit-service
          predicates:
            - Path=/api/audit/**
          filters:
            - name: CircuitBreaker
              args:
                name: audit-service
                fallbackuri: forward:/fallback/audit-service
            - AuthenticationFilter
        
        # Beneficiary Service Routes
        - id: beneficiary-service
          uri: lb://bharatbank-beneficiary-service
          predicates:
            - Path=/api/beneficiaries/**
          filters:
            - name: CircuitBreaker
              args:
                name: beneficiary-service
                fallbackuri: forward:/fallback/beneficiary-service
            - AuthenticationFilter
        
        # Card Service Routes
        - id: card-service
          uri: lb://bharatbank-card-service
          predicates:
            - Path=/api/cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: card-service
                fallbackuri: forward:/fallback/card-service
            - AuthenticationFilter
        
        # Report Service Routes
        - id: report-service
          uri: lb://bharatbank-report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: report-service
                fallbackuri: forward:/fallback/report-service
            - AuthenticationFilter
      
      default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=X-Response-Default-Foo, Default-Bar
            - Retry=3

  # Redis for rate limiting
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Security
security:
  jwt:
    secret: ${JWT_SECRET:bharatbank-secret-key-2024-very-long-and-secure-key-for-jwt-signing}
    expiration: 86400000

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      customer-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      notification-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      payment-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      audit-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      beneficiary-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      card-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      report-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.bharatbank.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
